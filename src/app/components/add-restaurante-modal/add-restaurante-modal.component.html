<ion-header>
  <ion-toolbar>
    <ion-title>Añadir Restaurante</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancelar()">Cancelar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="guardar()">
    <ion-list lines="full">

      <!-- Nombre -->
      <ion-item>
        <ion-input
          label="Nombre"
          labelPlacement="floating"
          formControlName="documentName"
          type="text">
        </ion-input>
      </ion-item>
      @if (form.get('documentName')?.invalid && form.get('documentName')?.touched) {
        <ion-text color="danger" class="ion-padding-start">
          <small>El nombre es obligatorio</small>
        </ion-text>
      }

      <!-- Territorio -->
      <ion-item>
        <ion-input
          label="Territorio"
          labelPlacement="floating"
          formControlName="territory"
          type="text">
        </ion-input>
      </ion-item>
      @if (form.get('territory')?.invalid && form.get('territory')?.touched) {
        <ion-text color="danger" class="ion-padding-start">
          <small>El territorio es obligatorio</small>
        </ion-text>
      }

      <!-- Localidad -->
      <ion-item>
        <ion-input
          label="Localidad"
          labelPlacement="floating"
          formControlName="locality"
          type="text">
        </ion-input>
      </ion-item>

      <!-- Dirección -->
      <ion-item>
        <ion-input
          label="Dirección"
          labelPlacement="floating"
          formControlName="address"
          type="text">
        </ion-input>
      </ion-item>

      <!-- Teléfono -->
      <ion-item>
        <ion-input
          label="Teléfono"
          labelPlacement="floating"
          type="tel"
          formControlName="phone">
        </ion-input>
      </ion-item>

      <!-- Web -->
      <ion-item>
        <ion-input
          label="Web"
          labelPlacement="floating"
          type="url"
          formControlName="web">
        </ion-input>
      </ion-item>

      <!-- Estrellas Michelin -->
      <ion-item>
        <ion-input
          label="Estrellas Michelin"
          labelPlacement="floating"
          type="text"
          formControlName="michelinStar">
        </ion-input>
      </ion-item>

      <!-- Soles Repsol -->
      <ion-item>
        <ion-input
          label="Soles Repsol"
          labelPlacement="floating"
          type="text"
          formControlName="repsolSun">
        </ion-input>
      </ion-item>

    </ion-list>

    <div class="ion-padding-top">
      <ion-button type="submit" expand="block" [disabled]="guardando()">
        @if (guardando()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Guardar
        }
      </ion-button>
